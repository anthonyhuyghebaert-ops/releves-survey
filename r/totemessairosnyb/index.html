<style>
:root{--ink:#0F0D0C;--or:#E85E10;--or2:#FF7A2E;--gray:#6E655C;--line:#DADADA;--mist:#F1F1F0;--red:#D4121E;--ok:#1B8A3A;--blue:#1565C0;

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#F1EEE9;color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.4;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0}
.top h1{margin:0;font-family:var(--text);font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.top h1 span{color:var(--or2)}
.top p{margin:2px 0 8px;font-size:12px;color:#C9C2B8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:6px;background:#3A3632}.prog i{display:block;height:100%;background:var(--or);width:0}
#cnt{display:block;font-size:11px;color:#C9C2B8;padding:4px 0 6px;font-variant-numeric:tabular-nums}
#nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:#fff;border-bottom:1px solid #DDD6CB;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav button{flex:none;border:1px solid #CFC7BB;background:#fff;padding:8px 10px;font-size:13px;cursor:pointer;white-space:nowrap;min-height:40px}
#nav button small{margin-left:6px;color:#8A8177;font-variant-numeric:tabular-nums}
#nav button.ok{border-color:var(--ok);color:var(--ok)}#nav button.ok small{color:var(--ok)}
#nav button.cur{background:var(--ink);color:#fff;border-color:var(--ink)}#nav button.cur small{color:#C9C2B8}
.fld{background:#fff;border:1px solid #CFC7BB;padding:14px}
main{max-width:1180px;margin:0 auto;padding:16px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);margin:0 0 6px}
h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:.95;letter-spacing:-.035em;margin:0 0 14px}
h1 em{font-style:normal;color:var(--or)}
h2{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.03em;margin:0 0 8px}
p{margin:0 0 12px}
.hint{color:var(--gray);font-size:14px}
.hint.ok{color:var(--ok);font-weight:700;font-size:17px}
.view{display:block;width:100%;height:auto;background:var(--mist);border:1px solid var(--line);touch-action:manipulation}
.zw{position:relative}
.zb{display:flex;gap:4px;justify-content:flex-end;margin-top:4px}
.zb button{min-width:40px;height:40px;padding:0 10px;border:1px solid var(--ink);background:#fff;color:var(--ink);font:700 18px/1 var(--text);cursor:pointer}
.zb button[data-zm="fit"]{font-size:13px}
.zb button:disabled{opacity:.35}
.toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--ink);color:#fff;padding:12px 14px;font-size:15px;max-width:560px;margin:0 auto;border-left:6px solid var(--or)}
.views{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.vlab{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:#fff;padding:2px 6px;display:inline-block}
label.f{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);margin:12px 0 4px}
input[type=text],input[type=email],input[type=tel],textarea{width:100%;border:1px solid #B9B0A4;border-radius:0;padding:12px;background:#fff;min-height:52px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.big{display:flex;align-items:stretch;border:2px solid var(--or)}
.big input{border:0;font-size:36px;font-weight:700;min-height:80px;padding:8px 14px;min-width:0;flex:1;text-align:right;font-variant-numeric:tabular-nums}
.big input:disabled{background:#EFEBE5;color:#8A8177}
.big span{display:flex;align-items:center;padding:0 18px;font-size:20px;font-weight:700;color:#fff;background:var(--ink)}
.do{margin:0 0 10px;color:#5C544B;font-size:15px}
.ft{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;font-size:20px;line-height:1.2}.ft .code{margin-top:-2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 18px;border:2px solid var(--ink);background:#fff;font-weight:700;cursor:pointer;border-radius:0;text-align:center}
.btn-or{background:var(--or);border-color:var(--or);color:#fff}
.btn-ink{background:var(--ink);color:#fff}
.btn-block{width:100%}
.btn[aria-pressed=true]{background:var(--ink);color:#fff}
.btn.sm{min-height:44px;font-size:15px;padding:6px 12px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn .btn{min-height:84px;font-size:26px}
.yn .btn[aria-pressed=true].y{background:var(--ok);border-color:var(--ok)}
.yn .btn[aria-pressed=true].n{background:var(--red);border-color:var(--red)}
.code{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:30px;padding:0 9px;border-radius:15px;background:var(--red);color:#fff;font-weight:700;font-size:14px;flex:none}
.code.photo{background:#39FF14;color:#000;border:2px solid #000}
.code.question{background:var(--or)}
.code.cablage{background:var(--blue);border-radius:0}
.code.done{background:var(--ok);color:#fff;border:0}
.code.skip{background:var(--gray);color:#fff;border:0}
.lst{list-style:none;margin:0 0 14px;padding:0 12px;border:1px solid #CFC7BB;background:#fff}
.lst li{border-bottom:1px solid var(--line)}.lst li:last-child{border-bottom:0}
.lst button{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:8px 2px;border:0;background:transparent;text-align:left;cursor:pointer}
.lst .lb{flex:1;min-width:0}
.lst .rw{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 2px}
.lst .st.lt{color:var(--or);font-weight:700}
.big input:focus{outline:0}.big:focus-within{box-shadow:0 0 0 3px var(--or)}
.big .okb{border:0;background:var(--or);color:#fff;font-weight:800;font-size:20px;padding:0 18px;min-width:76px;cursor:pointer;font-family:inherit}
.blink{animation:blink 1.1s steps(1,end) infinite}

.band{margin:0 0 12px;padding:10px 14px;border-left:6px solid var(--or);background:#fff;font-weight:700}
.plan{display:block;width:100%;height:auto;background:#EFEBE5}
.zl button{min-height:68px}.zl .lb b{display:block;font-size:17px}.zl .lb small{display:block;color:var(--gray);font-size:14px}
.lst .st{font-size:14px;color:var(--gray);white-space:nowrap}
.lst .st.ok{color:var(--ok);font-weight:700}
.shot{width:100%;max-height:46vh;object-fit:contain;background:var(--mist);border:1px solid var(--line);display:block;margin:10px 0}

.card.ok{border-left-color:var(--ok)}.card.opt{border-left:1px solid #CFC7BB}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}

.sheet>div{background:#fff;width:100%;max-width:640px;max-height:86vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.note{background:#fff;border:1px solid #CFC7BB;padding:12px 14px;font-size:15px;margin-bottom:12px}
.err{color:var(--red);font-weight:600}
.two{display:block}
@media (min-width:900px){
  body{font-size:17px}
  .two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}

.ttc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}

.ttv:focus-visible{outline:3px solid #E85E10;outline-offset:2px}

</style>

/* ---------- sortie : donn\u00e9es + r\u00e9capitulatif ---------- */
function answer() {

function clean(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

  doc.setFillColor('#0F0D0C'); doc.rect(0, 0, W, 30, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor('#FF7A2E'); doc.text('DT SIGNS x DK PRINTING - RELEVE DE COTES - SAISIE WEB', M, 10);
  doc.setFontSize(18); doc.setTextColor('#FFFFFF'); doc.text(lat((F.enseigne || '') + ' - ' + (F.site || '')), M, 19);
  doc.setFontSize(10); doc.setFont('helvetica', 'normal'); doc.text(lat(F.pr + ' - fiche v' + F.version + ' - ' + (F.adresse || '')), M, 25.5);

  line('Releve termine le ' + new Date(a.fin).toLocaleString('fr-FR') + ' - cotes en ' + U + (a.test ? ' - version de test' : ''), 10, false, '#6E655C'); y += 3;

    else if (e.genre === 'question') { var okq = r.impossible || (r.attendu === 'schema' ? r.prise : r.attendu === 'texte' ? !!r.precisions : !!r.reponse); val = (r.impossible ? 'IMPOSSIBLE' + (r.raison ? ' (' + r.raison + ')' : '') : r.attendu === 'schema' ? (r.prise ? 'SCHEMA PHOTOGRAPHIE' : 'schema manquant') : r.attendu === 'texte' ? (r.precisions || 'sans reponse') : (r.reponse ? r.reponse.toUpperCase() : 'sans reponse')) + (r.precisions && r.attendu !== 'texte' ? ' - ' + r.precisions : ''); if (!okq) col = '#D4121E'; }

function send(share) {

    say('Fichiers t\u00e9l\u00e9charg\u00e9s : ' + files.map(function (f) { return f.name; }).join(' et ') + '. Envoie-les \u00e0 ton charg\u00e9 de projet.' + noPdf);
  }
